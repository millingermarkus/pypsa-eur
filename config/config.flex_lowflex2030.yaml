  #fractions refer to the total primary HVC production in 2020
  #assumes 6.7 Mtplastics produced from recycling in 2020
  HVC_primary_fraction:
    2020: 0.88
    2025: 0.85
    2030: 0.88
    2035: 0.7
    2040: 0.6
    2045: 0.5
    2050: 0.6
  HVC_mechanical_recycling_fraction:
    2020: 0.12
    2025: 0.15
    2030: 0.12
    2035: 0.21
    2040: 0.24
    2045: 0.27
    2050: 0.20
  HVC_chemical_recycling_fraction:
    2020: 0.0
    2025: 0.0
    2030: 0.0
    2035: 0.08
    2040: 0.12
    2045: 0.16
    2050: 0.10
  HVC_environment_sequestration_fraction: 0.
  waste_to_energy: true
  waste_to_energy_cc: true
  sector_ratios_fraction_future:
    2020: 0.0
    2025: 0.05
    2030: 0.0
    2035: 0.45
    2040: 0.7
    2045: 0.85
    2050: 0.8
  basic_chemicals_without_NH3_production_today: 69. #Mt/a, = 86 Mtethylene-equiv - 17 MtNH3
  HVC_production_today: 52.
  MWh_elec_per_tHVC_mechanical_recycling: 0.547
  MWh_elec_per_tHVC_chemical_recycling: 6.9
  chlorine_production_today: 9.58
  MWh_elec_per_tCl: 3.6
  MWh_H2_per_tCl: -0.9372
  methanol_production_today: 1.5
  MWh_elec_per_tMeOH: 0.167
  MWh_CH4_per_tMeOH: 10.25
  MWh_MeOH_per_tMeOH: 5.528
  hotmaps_locate_missing: false
  reference_year: 2019
  oil_refining_emissions: 0.013


# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#costs
costs:
  year: 2020
  social_discountrate: 0.02
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    "CO2 intensity": 0
    "discount rate": 0.07
    "standing losses": 0
  custom_cost_fn: data/custom_costs.csv
  overwrites: {}
  emission_prices:
    enable: false
    co2: 0.
    co2_monthly_prices: false

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#clustering
clustering:
  temporal:
    resolution_sector: "300H"

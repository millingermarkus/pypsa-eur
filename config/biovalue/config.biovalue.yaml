# Shared settings of the biovalue runs, ported from the pypsa-eur-sec biovalue
# branch (server configs config/biovalue/config.biovalue_{base,all,ccs,efuel,PE}.yaml).
#
# The sector_opts wildcards and the sensitivity wildcards of pypsa-eur-sec
# (ft_s, h2_s, cc_s, cs_s, ...) are expressed as scenarios in
# config/biovalue/scenarios.yaml, generated by config/biovalue/create_scenarios.py.
# Select a run set with one of the config/biovalue/config.biovalue_<set>.yaml files:
#
#   snakemake --configfile config/biovalue/config.biovalue.yaml config/biovalue/config.biovalue_base.yaml

run:
  name: all
  scenarios:
    enable: true
    file: config/biovalue/scenarios.yaml
  shared_resources:
    policy: base

foresight: overnight
planning_horizons:
- 2050

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR', 'GB', 'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'ME', 'MK', 'NL', 'NO', 'PL', 'PT', 'RO', 'RS', 'SE', 'SI', 'SK']

clustering:
  cluster_network:
    n_clusters: 37
  temporal:
    averaging: 5h  # sector_opts 5H

# Co2Lx in sector_opts; the value per scenario is set in scenarios.yaml
co2_budget:
  emissions_scope: CO2
  relative: true

electricity:
  transmission_limit: v2.0  # lv2; scenarios with lv1 override this

costs:
  year: 2040
  # Sensitivity cost files (FT, H2, DAC) are appended per scenario in scenarios.yaml
  custom_cost_fn:
  - data/custom_costs.csv

biomass:
  year: 2040
  scenario: ENS_High
  # pypsa-eur-sec: scenario_digestible: ENS_Med
  class_scenarios:
    biogas: ENS_Med
  # Agricultural waste (straw) is digestible biomass in biovalue, i.e. biogas
  classes:
    solid biomass:
    - Fuelwood residues
    - Secondary Forestry residues - woodchips
    - Sawdust
    - Residues from landscape care
    biogas:
    - Manure solid, liquid
    - Sludge
    - Agricultural waste
    municipal solid waste:
    - Municipal waste
  feedstocks:
    enable: true
    groups:
      forest residues:
      - Fuelwood residues
      industry wood residues:
      - Secondary Forestry residues - woodchips
      - Sawdust
      landscape care:
      - Residues from landscape care
      manureslurry:
      - Manure solid, liquid
      sewage sludge:
      - Sludge
      straw:
      - Agricultural waste

sector:
  district_heating:
    potential: 0.6
    progress:
      2050: 0.5
  land_transport_fuel_cell_share:
    2050: 0.15
  land_transport_electric_share:
    2050: 0.85
  land_transport_ice_share:
    2050: 0.0
  agriculture_machinery_electric_share: 0
  agriculture_machinery_oil_share: 1
  shipping_hydrogen_liquefaction: true
  shipping_hydrogen_share:
    2050: 0.5
  shipping_methanol_share:
    2050: 0.0
  shipping_oil_share:
    2050: 0.5
  aviation_demand_factor: 1.7
  solar_thermal: false
  co2_vent: true
  co2_spatial: false
  co2_network: false
  regional_co2_sequestration_potential:
    enable: false
  co2_sequestration_cost: 10  # CS0; CS2 scenarios override this
  cc_fraction: 0.9
  electricity_distribution_grid: false
  gas_network: false
  H2_network: true
  conventional_generation:
    OCGT: gas
    CCGT: gas
    coal: coal
    oil: oil
    lignite: lignite
    nuclear: uranium
  # waste_heat_usage_share: 0.5 applied to all waste heat sources
  use_fischer_tropsch_waste_heat: 0.5
  use_fuel_cell_waste_heat: 0.5
  use_electrolysis_waste_heat: 0.5
  use_methanation_waste_heat: 0.5
  # biomass supply and conversion
  biomass_spatial: false
  biomass_transport: false
  biomass_boiler: true
  biogas_upgrading_cc: true
  biomass_to_liquid: true
  biomass_to_liquid_cc: true
  electrobiofuels: true
  biosng: true
  biosng_cc: true
  bioH2: true
  municipal_solid_waste: true
  # industrial process heat; industrial_steam_heat_pumps: false
  industry_heat:
    enable: true
    technologies:
      "heat100-200":
      - solid biomass
      - gas
      - electric boiler
      "heat200-500":
      - solid biomass
      - gas
      - hydrogen
      heat500+:
      - gas
      - hydrogen
  # "Im" in B0p8Im: import at 15 EUR/GJ, stepped supply curve, IM1 = no upstream emissions
  solid_biomass_import:
    enable: true
    price: 54
    upstream_emissions_factor: 0.0
    supply_curve:
      enable: true
  # "B0p8" in B0p8Im: liquid fuels from biomass, electrofuels and electrobiofuels
  # >= 80% of transport and agriculture oil demand
  renewable_liquid_fuel_share:
    enable: true
    share: 0.8
    sense: ">="
  # "solidN" in sector_opts; the limit per scenario is set in scenarios.yaml
  solid_biomass_limit:
    enable: true

industry:
  waste_to_energy: true

solving:
  solver:
    name: gurobi
    options: gurobi-biovalue
  solver_options:
    gurobi-biovalue:
      threads: 8
      method: 2
      crossover: 0
      BarConvTol: 1.e-4
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
      BarHomogeneous: 1
      ScaleFlag: 0
      FeasibilityTol: 1.e-3
  mem_mb: 150000
